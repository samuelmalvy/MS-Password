  <script>
    (() => {
      const fileInput = document.getElementById("csv-file");
      const dropZone = document.getElementById("drop-zone");
      const clearButton = document.getElementById("clear-button");
      const searchInput = document.getElementById("search-input");
      const searchForm = document.getElementById("search-form");
      const languageFilter = document.getElementById("language-filter");
      const passwordFilter = document.getElementById("password-filter");
      const status = document.getElementById("file-status");
      const lookupWorkspace = document.getElementById("lookup-workspace");
      const resultCount = document.getElementById("result-count");
      const emptyState = document.getElementById("empty-state");
      const noResults = document.getElementById("no-results");
      const resultsArea = document.getElementById("results-area");
      const resultsBody = document.getElementById("results-body");
      const mobileResults = document.getElementById("mobile-results");
      const toast = document.getElementById("toast");

      let records = [];
      let filteredRecords = [];
      let revealedIds = new Set();
      let toastTimer;

      const normalizeHeader = value =>
        value.replace(/^\uFEFF/, "").trim().toLowerCase().replace(/\s+/g, " ");

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let field = "";
        let quoted = false;

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"') {
            if (quoted && next === '"') {
              field += '"';
              i++;
            } else {
              quoted = !quoted;
            }
          } else if (char === "," && !quoted) {
            row.push(field);
            field = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") i++;
            row.push(field);
            if (row.some(cell => cell.trim() !== "")) rows.push(row);
            row = [];
            field = "";
          } else {
            field += char;
          }
        }

        row.push(field);
        if (row.some(cell => cell.trim() !== "")) rows.push(row);
        return rows;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function setStatus(message, type = "neutral") {
        status.textContent = message;
        status.className = "text-sm";
        status.classList.add(
          type === "error" ? "text-rose-300" :
          type === "success" ? "text-emerald-300" : "text-slate-300"
        );
      }

      function showToast(message, error = false) {
        toast.textContent = message;
        toast.classList.remove("hidden", "text-cyan-100", "text-rose-100", "border-cyan-400/30", "border-rose-400/30");
        toast.classList.add(error ? "text-rose-100" : "text-cyan-100");
        toast.classList.add(error ? "border-rose-400/30" : "border-cyan-400/30");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.add("hidden"), 2200);
      }

      function loadFile(file) {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith(".csv") && file.type !== "text/csv") {
          setStatus("Please choose a valid CSV file.", "error");
          return;
        }

        setStatus(`Reading ${file.name}…`);
        const reader = new FileReader();

        reader.onload = event => {
          try {
            const rows = parseCsv(String(event.target.result || ""));
            if (rows.length < 2) throw new Error("The CSV does not contain any data rows.");

            const headers = rows[0].map(normalizeHeader);
            const required = ["name", "language", "version", "password", "file name"];
            const missing = required.filter(header => !headers.includes(header));

            if (missing.length) {
              throw new Error(`Missing required column${missing.length > 1 ? "s" : ""}: ${missing.join(", ")}.`);
            }

            const index = Object.fromEntries(required.map(header => [header, headers.indexOf(header)]));
            records = rows.slice(1)
              .filter(row => row.some(cell => String(cell).trim()))
              .map((row, position) => ({
                id: `row-${position}`,
                name: String(row[index.name] || "").trim(),
                language: String(row[index.language] || "").trim(),
                version: String(row[index.version] || "").trim(),
                password: String(row[index.password] || ""),
                fileName: String(row[index["file name"]] || "").trim()
              }));

            if (!records.length) throw new Error("No usable records were found.");

            revealedIds.clear();
            populateLanguages();
            setControlsEnabled(true);
            setStatus(`${file.name} loaded — ${records.length} records available.`, "success");
            emptyState.classList.add("hidden");
            lookupWorkspace.classList.remove("opacity-60");
            applyFilters();
            searchInput.focus();
          } catch (error) {
            clearData(false);
            setStatus(error.message || "The CSV could not be read.", "error");
          }
        };

        reader.onerror = () => setStatus("The selected file could not be read.", "error");
        reader.readAsText(file, "UTF-8");
      }

      function populateLanguages() {
        const currentOptions = [...languageFilter.options].slice(1);
        currentOptions.forEach(option => option.remove());

        const languages = [...new Set(records.map(record => record.language).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b));

        languages.forEach(language => {
          const option = document.createElement("option");
          option.value = language;
          option.textContent = language;
          languageFilter.appendChild(option);
        });
      }

      function setControlsEnabled(enabled) {
        searchInput.disabled = !enabled;
        languageFilter.disabled = !enabled;
        passwordFilter.disabled = !enabled;
        clearButton.disabled = !enabled;
      }

      function clearData(showMessage = true) {
        records = [];
        filteredRecords = [];
        revealedIds.clear();
        fileInput.value = "";
        searchInput.value = "";
        languageFilter.value = "all";
        passwordFilter.value = "all";
        setControlsEnabled(false);
        resultsBody.replaceChildren();
        mobileResults.replaceChildren();
        resultsArea.classList.add("hidden");
        noResults.classList.add("hidden");
        emptyState.classList.remove("hidden");
        lookupWorkspace.classList.add("opacity-60");
        resultCount.textContent = "0 results";
        populateLanguages();
        if (showMessage) setStatus("CSV removed. Choose a file to begin.");
      }

      function applyFilters() {
        const query = searchInput.value.trim().toLocaleLowerCase();
        const selectedLanguage = languageFilter.value;
        const selectedPassword = passwordFilter.value;

        filteredRecords = records.filter(record => {
          const searchable = [record.name, record.fileName, record.language, record.version]
            .join(" ")
            .toLocaleLowerCase();
          const matchesSearch = !query || searchable.includes(query);
          const matchesLanguage = selectedLanguage === "all" || record.language === selectedLanguage;
          const hasPassword = record.password.length > 0;
          const matchesPassword =
            selectedPassword === "all" ||
            (selectedPassword === "available" && hasPassword) ||
            (selectedPassword === "missing" && !hasPassword);

          return matchesSearch && matchesLanguage && matchesPassword;
        });

        renderResults();
      }

      function passwordMarkup(record) {
        if (!record.password) {
          return '<span class="text-slate-500">Not provided</span>';
        }
        const visible = revealedIds.has(record.id);
        return `<span class="password-value mono text-sm ${visible ? "text-amber-200" : "tracking-widest text-slate-300"}">${visible ? escapeHtml(record.password) : "••••••••••••"}</span>`;
      }

      function actionMarkup(record) {
        if (!record.password) {
          return '<span class="text-xs text-slate-600">—</span>';
        }
        const visible = revealedIds.has(record.id);
        return `
          <div class="flex justify-end gap-2">
            <button type="button" class="reveal-button action-button rounded-lg border border-slate-600 p-2 text-slate-200" data-id="${record.id}" aria-label="${visible ? "Hide" : "Reveal"} password for ${escapeHtml(record.name)}">
              <i data-lucide="${visible ? "eye-off" : "eye"}" class="h-4 w-4" aria-hidden="true"></i>
            </button>
            <button type="button" class="copy-button action-button rounded-lg bg-cyan-400 p-2 text-slate-950" data-id="${record.id}" aria-label="Copy password for ${escapeHtml(record.name)}">
              <i data-lucide="copy" class="h-4 w-4" aria-hidden="true"></i>
            </button>
          </div>`;
      }

      function renderResults() {
        const count = filteredRecords.length;
        resultCount.textContent = `${count} result${count === 1 ? "" : "s"}`;

        if (!records.length) {
          resultsArea.classList.add("hidden");
          noResults.classList.add("hidden");
          emptyState.classList.remove("hidden");
          return;
        }

        emptyState.classList.add("hidden");

        if (!count) {
          resultsArea.classList.add("hidden");
          noResults.classList.remove("hidden");
          return;
        }

        noResults.classList.add("hidden");
        resultsArea.classList.remove("hidden");

        const bodyFragment = document.createDocumentFragment();
        const mobileFragment = document.createDocumentFragment();

        filteredRecords.forEach((record, index) => {
          const tr = document.createElement("tr");
          tr.className = "result-row bg-slate-950/20 hover:bg-cyan-400/[.035]";
          tr.dataset.recordId = record.id;
          tr.style.animationDelay = `${Math.min(index * 25, 250)}ms`;
          tr.innerHTML = `
            <td class="max-w-xs px-4 py-4 align-top">
              <div class="font-semibold text-slate-100">${escapeHtml(record.name || "Untitled")}</div>
            </td>
            <td class="px-4 py-4 align-top"><span class="mono rounded-md bg-slate-800 px-2 py-1 text-xs text-cyan-200">${escapeHtml(record.version || "—")}</span></td>
            <td class="px-4 py-4 align-top text-sm text-slate-300">${escapeHtml(record.language || "—")}</td>
            <td class="max-w-sm px-4 py-4 align-top text-sm text-slate-400"><span class="break-words">${escapeHtml(record.fileName || "—")}</span></td>
            <td class="password-cell max-w-xs px-4 py-4 align-top">${passwordMarkup(record)}</td>
            <td class="actions-cell px-4 py-4 align-top">${actionMarkup(record)}</td>`;
          bodyFragment.appendChild(tr);

          const article = document.createElement("article");
          article.className = "result-row rounded-2xl border border-slate-700 bg-slate-950/30 p-4";
          article.dataset.recordId = record.id;
          article.style.animationDelay = `${Math.min(index * 25, 250)}ms`;
          article.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <h3 class="font-bold text-slate-100">${escapeHtml(record.name || "Untitled")}</h3>
              <span class="mono shrink-0 rounded-md bg-slate-800 px-2 py-1 text-xs text-cyan-200">${escapeHtml(record.version || "—")}</span>
            </div>
            <dl class="mt-4 grid gap-3 text-sm">
              <div><dt class="text-xs uppercase tracking-wider text-slate-500">Language</dt><dd class="mt-1 text-slate-300">${escapeHtml(record.language || "—")}</dd></div>
              <div><dt class="text-xs uppercase tracking-wider text-slate-500">File</dt><dd class="mt-1 break-words text-slate-300">${escapeHtml(record.fileName || "—")}</dd></div>
              <div><dt class="text-xs uppercase tracking-wider text-slate-500">Password</dt><dd class="password-cell mt-1">${passwordMarkup(record)}</dd></div>
            </dl>
            <div class="actions-cell mt-4">${actionMarkup(record)}</div>`;
          mobileFragment.appendChild(article);
        });

        resultsBody.replaceChildren(bodyFragment);
        mobileResults.replaceChildren(mobileFragment);
        bindResultActions();
        lucide.createIcons();
      }

      function bindResultActions() {
        document.querySelectorAll(".reveal-button").forEach(button => {
          button.addEventListener("click", () => {
            const id = button.dataset.id;
            if (revealedIds.has(id)) revealedIds.delete(id);
            else revealedIds.add(id);
            updateRecordViews(id);
          });
        });

        document.querySelectorAll(".copy-button").forEach(button => {
          button.addEventListener("click", async () => {
            const record = records.find(item => item.id === button.dataset.id);
            if (!record || !record.password) return;

            try {
              await navigator.clipboard.writeText(record.password);
              showToast("Password copied to clipboard.");
            } catch {
              const textarea = document.createElement("textarea");
              textarea.value = record.password;
              textarea.style.position = "fixed";
              textarea.style.opacity = "0";
              document.body.appendChild(textarea);
              textarea.select();
              const copied = document.execCommand("copy");
              textarea.remove();
              showToast(copied ? "Password copied to clipboard." : "Copy failed. Reveal and copy it manually.", !copied);
            }
          });
        });
      }

      function updateRecordViews(id) {
        const record = records.find(item => item.id === id);
        if (!record) return;

        document.querySelectorAll(`[data-record-id="${CSS.escape(id)}"]`).forEach(element => {
          const passwordCell = element.querySelector(".password-cell");
          const actionsCell = element.querySelector(".actions-cell");
          if (passwordCell) passwordCell.innerHTML = passwordMarkup(record);
          if (actionsCell) actionsCell.innerHTML = actionMarkup(record);
        });

        bindResultActions();
        lucide.createIcons();
      }

      fileInput.addEventListener("change", () => loadFile(fileInput.files[0]));

      document.querySelector('label[for="csv-file"]').addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          fileInput.click();
        }
      });

      ["dragenter", "dragover"].forEach(type => {
        dropZone.addEventListener(type, event => {
          event.preventDefault();
          dropZone.classList.add("is-dragging");
        });
      });

      ["dragleave", "drop"].forEach(type => {
        dropZone.addEventListener(type, event => {
          event.preventDefault();
          dropZone.classList.remove("is-dragging");
        });
      });

      dropZone.addEventListener("drop", event => loadFile(event.dataTransfer.files[0]));
      clearButton.addEventListener("click", () => clearData(true));
      searchForm.addEventListener("submit", event => event.preventDefault());
      searchInput.addEventListener("input", applyFilters);
      languageFilter.addEventListener("change", applyFilters);
      passwordFilter.addEventListener("change", applyFilters);

      lucide.createIcons();
    })();
  </script>
 </body>
</html>
